services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3003:3000"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.1.31:3003"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - homepage_net
      - ha_ha_net

networks:
  homepage_net:
    driver: bridge
  ha_ha_net:
    external: true
